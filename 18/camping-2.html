<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전국 캠핑장 현황</title>
</head>
<body>
  <h1>전국 캠핑장 현황</h1>
  <div id="map" style="width:100%;height:550px;"></div>

  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=&libraries=clusterer"></script>
  <script>
    const lat = 37.55684;
    const lng = 126.91404;

    var mapContainer = document.getElementById('map'), // 지도를 표시할 div 
        mapOption = { 
            center: new kakao.maps.LatLng(lat, lng), // 지도의 중심좌표 - 이지스퍼블리싱
            level: 14 // 지도의 확대 레벨
        };

    // 지도를 표시할 div와  지도 옵션으로  지도를 생성합니다
    var map = new kakao.maps.Map(mapContainer, mapOption); 

    // 마커 클러스터러를 생성합니다 
    var clusterer = new kakao.maps.MarkerClusterer({
      map: map, // 마커들을 클러스터로 관리하고 표시할 지도 객체 
      averageCenter: true, // 클러스터에 포함된 마커들의 평균 위치를 클러스터 마커 위치로 설정 
      minLevel: 10 // 클러스터 할 최소 지도 레벨 
    });

    const url = 'https://apis.data.go.kr/B551011/GoCamping/basedList?numOfRows=230&MobileOS=ETC&MobileApp=testAPP&serviceKey=&_type=json'
    fetch(url)
    .then(res => res.json())
    .then(json => {
      const data = json.response.body.items.item;
      var markers = [];

      for(let i=0; i<data.length; i++){
        var marker = new kakao.maps.Marker({
          map:map,
          position:new kakao.maps.LatLng(data[i].mapY, data[i].mapX)
        });

        markers.push(marker);

        var infowindow = new kakao.maps.InfoWindow({
          content : data[i].facltNm,
        });

        kakao.maps.event.addListener(marker, 'mouseover', makeOverListener(map, marker, infowindow));  
      // 마커에서 마우스아웃하면 makeOutListener() 실행
        kakao.maps.event.addListener(marker, 'mouseout', makeOutListener(infowindow));
      }
      

      

      // 인포윈도우를 표시하는 클로저를 만드는 함수입니다 
      function makeOverListener(map, marker, infowindow) {
          return function() {
              infowindow.open(map, marker);          
          };
      }

      // 인포윈도우를 닫는 클로저를 만드는 함수입니다 
      function makeOutListener(infowindow) {
          return function() {
              infowindow.close();
          };
      }

      clusterer.addMarkers(markers);
    });
  </script>
</body>
</html>
